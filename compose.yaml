services:
  postgres:
    image: mirror.gcr.io/library/postgres:15
    container_name: retail_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - retail_data:/var/lib/postgresql/data
volumes:
  retail_data: